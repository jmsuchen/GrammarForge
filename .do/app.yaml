name: grammarforge-api
services:
  - name: api
    github:
      repo: jmsuchen/GrammarForge
      branch: main
      deploy_on_push: true
    source_dir: backend
    dockerfile_path: backend/Dockerfile
    http_port: 8000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    routes:
      - path: /
    envs:
      - key: DEEPSEEK_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: CHANGE_ME_IN_DIGITALOCEAN
      - key: DEEPSEEK_MODEL
        scope: RUN_TIME
        value: deepseek-chat
      - key: ALLOWED_ORIGINS
        scope: RUN_TIME
        value: "*"
